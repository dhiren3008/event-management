<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard | Infinite Success Events</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/member/dashboard.css">
</head>
<body>
    <div id="app">
        <div class="member-dashboard">
            <!-- ===== Left Column: Main Content ===== -->
            <div class="member-dashboard__main">

                <!-- Upcoming Event Hero Card Container -->
                <section class="member-hero" id="hero-container">
                    <div class="member-hero__content">
                        <span class="member-hero__tag">Upcoming Event Details</span>
                        <h2 class="member-hero__title" id="hero-title">Loading upcoming event...</h2>
                        <div class="member-hero__meta" id="hero-meta"></div>
                        <a href="/pages/member/events.html" class="btn-hero" id="hero-btn">Book Now</a>
                    </div>
                </section>

                <!-- Weekly Basis Status -->
                <section class="weekly-status">
                    <div class="weekly-status__header">
                        <h3 class="weekly-status__title">Weekly Basis Status</h3>
                    </div>

                    <div class="weekly-status__cards">
                        <!-- Card 1: Attended -->
                        <article class="status-box">
                            <div class="status-box__left">
                                <span class="status-box__number" id="weekly-attended-count">0</span>
                                <span class="status-box__text">Events attended in this week</span>
                            </div>
                            <div class="status-box__icon-badge">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><polyline points="9 14 11 16 15 12"/></svg>
                            </div>
                        </article>

                        <!-- Card 2: Scheduled -->
                        <article class="status-box">
                            <div class="status-box__left">
                                <span class="status-box__number" id="weekly-scheduled-count">0</span>
                                <span class="status-box__text">Events scheduled in this week</span>
                            </div>
                            <div class="status-box__icon-badge">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 16 11 18 15 14"/></svg>
                            </div>
                        </article>
                    </div>
                </section>

                <!-- Recommended Section -->
                <section class="recommended">
                    <div class="recommended__header">
                        <h3 class="recommended__title">Recommended</h3>
                        <a href="/pages/member/events.html" class="recommended__view-all">view all</a>
                    </div>

                    <div id="recommended-list" style="display: flex; flex-direction: column; gap: var(--space-md);">
                        <!-- Dynamic Recommended Cards injected here -->
                    </div>
                </section>

            </div>

            <!-- ===== Right Column: Recent Event Updates ===== -->
            <aside class="member-dashboard__side">
                <section class="updates-panel">
                    <h3 class="updates-panel__title">Recent Event Updates</h3>

                    <div class="updates-panel__list" id="updates-list">
                        <!-- Dynamic Update Items injected here -->
                    </div>
                </section>
            </aside>
        </div>
    </div>

    <script type="module" src="/js/member/dashboard.js"></script>
</body>
</html>

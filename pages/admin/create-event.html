<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event | Infinite Success Events</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/admin/create-event.css">
</head>
<body>
    <!-- Create Event form (also Edit Event when opened as ?id=N).
         js/admin/create-event.js validates every field, POSTs /events (or
         PATCHes the existing one) and redirects to the event list.
         Per-field messages live in the .form-error spans below each input. -->
    <div id="app">
        <div class="create-event">
            <h1 class="page-heading" id="create-heading">Create Event</h1>

            <form class="create-event__card" id="create-event-form" novalidate>
                <div class="field">
                    <label class="field__label" for="event-name">Event Name<span class="required" aria-hidden="true">*</span></label>
                    <input class="input" id="event-name" type="text" placeholder="Enter Name">
                    <span class="form-error is-hidden" id="error-event-name"></span>
                </div>

                <div class="field">
                    <label class="field__label" for="event-description">Event Description</label>
                    <textarea class="input create-event__textarea" id="event-description"
                              placeholder="Add Text Here..."></textarea>
                </div>

                <div class="create-event__grid">
                    <div class="field">
                        <label class="field__label" for="event-start-date">Event Start Date<span class="required" aria-hidden="true">*</span></label>
                        <span class="field-input field-input--picker">
                            <input class="input" id="event-start-date" type="date">
                            <span class="field-input__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            </span>
                        </span>
                        <span class="form-error is-hidden" id="error-event-start-date"></span>
                    </div>
                    <div class="field">
                        <label class="field__label" for="event-end-date">Event End Date<span class="required" aria-hidden="true">*</span></label>
                        <span class="field-input field-input--picker">
                            <input class="input" id="event-end-date" type="date">
                            <span class="field-input__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            </span>
                        </span>
                        <span class="form-error is-hidden" id="error-event-end-date"></span>
                    </div>

                    <div class="field">
                        <label class="field__label" for="booking-start-date">Booking Start Date<span class="required" aria-hidden="true">*</span></label>
                        <span class="field-input field-input--picker">
                            <input class="input" id="booking-start-date" type="date">
                            <span class="field-input__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            </span>
                        </span>
                        <span class="form-error is-hidden" id="error-booking-start-date"></span>
                    </div>
                    <div class="field">
                        <label class="field__label" for="booking-end-date">Booking End Date<span class="required" aria-hidden="true">*</span></label>
                        <span class="field-input field-input--picker">
                            <input class="input" id="booking-end-date" type="date">
                            <span class="field-input__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/>
                                    <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            </span>
                        </span>
                        <span class="form-error is-hidden" id="error-booking-end-date"></span>
                    </div>

                    <div class="field">
                        <label class="field__label" for="event-start-time">Event Start Time<span class="required" aria-hidden="true">*</span></label>
                        <span class="field-input field-input--picker">
                            <input class="input" id="event-start-time" type="time">
                            <span class="field-input__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            </span>
                        </span>
                        <span class="form-error is-hidden" id="error-event-start-time"></span>
                    </div>
                    <div class="field">
                        <label class="field__label" for="event-end-time">Event End Time<span class="required" aria-hidden="true">*</span></label>
                        <span class="field-input field-input--picker">
                            <input class="input" id="event-end-time" type="time">
                            <span class="field-input__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            </span>
                        </span>
                        <span class="form-error is-hidden" id="error-event-end-time"></span>
                    </div>

                    <div class="field">
                        <label class="field__label" for="event-price">Price<span class="required" aria-hidden="true">*</span></label>
                        <input class="input" id="event-price" type="number" min="1" step="1" placeholder="Enter Price">
                        <span class="form-error is-hidden" id="error-event-price"></span>
                    </div>
                    <div class="field">
                        <label class="field__label" for="event-capacity">Capacity<span class="required" aria-hidden="true">*</span></label>
                        <input class="input" id="event-capacity" type="number" min="1" step="1" placeholder="EX. 1000">
                        <span class="form-error is-hidden" id="error-event-capacity"></span>
                    </div>

                    <div class="field">
                        <label class="field__label" for="event-location">Add Location<span class="required" aria-hidden="true">*</span></label>
                        <span class="field-input">
                            <input class="input" id="event-location" type="text" placeholder="Search Location">
                            <span class="field-input__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                            </span>
                        </span>
                        <span class="form-error is-hidden" id="error-event-location"></span>
                    </div>
                    <div class="field">
                        <span class="field__label" id="upload-files-label">Upload Files</span>
                        <label class="field-input field-input--file" for="event-files">
                            <span class="input create-event__file-text" id="file-text">Add Files</span>
                            <span class="field-input__icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            </span>
                            <input id="event-files" type="file" multiple hidden>
                        </label>
                    </div>
                </div>

                <p class="form-message is-hidden" id="create-message"></p>

                <div class="create-event__actions">
                    <button class="btn btn--outline" type="button" id="cancel-create">Cancel</button>
                    <button class="btn btn--primary" type="button" id="submit-create">Create Event</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/js/admin/create-event.js"></script>
</body>
</html>

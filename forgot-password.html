<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Infinite Success Events</title>

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forgot-password.css">
</head>
<body>
    <main class="forgot">

        <section class="forgot__panel">
            <div class="forgot__brand">
                <img src="/assets/images/Logo.png" alt="Infinite Success Events logo">
            </div>

            <div class="forgot__form-area">
                <h1 class="forgot__title">Forget Password</h1>
                <p class="forgot__text">
                    Enter your mobile number for the verification process, We will send 4 digit code to your mobile number.
                </p>

                <form id="forgot-form" class="forgot__form" novalidate>
                    <p id="forgot-form-message" class="form-message is-hidden" role="alert"></p>

                    <div class="form-group">
                        <label for="forgot-mobile" class="form-label">Email/Mobile Number</label>
                        <div class="input-wrapper">
                            <span class="input-wrapper__prefix">+91</span>
                            <input type="tel" id="forgot-mobile" name="mobile" class="input input--prefixed"
                                placeholder="Enter mobile number" inputmode="numeric" minlength="10" maxlength="12" pattern="[0-9]{10,12}" autocomplete="tel-national">
                        </div>
                        <p id="forgot-mobile-error" class="form-error is-hidden"></p>
                    </div>

                    <button type="submit" id="forgot-submit" class="btn btn--primary btn--block">Continue</button>
                </form>

                <a href="/login.html" class="link forgot__back">Back to Log in</a>
            </div>
        </section>

        <section class="forgot__hero">
            <div class="forgot__hero-content">
                <h2 class="forgot__hero-title">Welcome Back!</h2>
                <p class="forgot__hero-text">
                    To keep connected with us please login with your personal info
                </p>
            </div>
        </section>
    </main>

    <script type="module" src="/js/core/forgot-password.js"></script>
</body>
</html>

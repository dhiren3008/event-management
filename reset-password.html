<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Infinite Success Events</title>

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/reset-password.css">
</head>
<body>
    <main class="reset">

        <section class="reset__panel">
            <div class="reset__brand">
                <img src="/assets/images/Logo.png" alt="Infinite Success Events logo">
            </div>

            <div class="reset__form-area">
                <h1 class="reset__title">Reset Password</h1>
                <p class="reset__text">
                    Set the new password for your account so you can login and access all the features.
                </p>

                <form id="reset-form" class="reset__form" novalidate>
                    <p id="reset-form-message" class="form-message is-hidden" role="alert"></p>

                    <div class="form-group">
                        <label for="reset-password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="reset-password" name="password" class="input"
                                placeholder="Enter password" autocomplete="new-password">
                            <button type="button" class="input-wrapper__toggle" data-password-toggle
                                aria-label="Show password" aria-pressed="false">
                                <svg class="toggle-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="toggle-eye-off is-hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                        <p id="reset-password-error" class="form-error is-hidden"></p>
                    </div>

                    <div class="form-group">
                        <label for="reset-confirm" class="form-label">Reenter Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="reset-confirm" name="confirmPassword" class="input"
                                placeholder="Reenter password" autocomplete="new-password">
                            <button type="button" class="input-wrapper__toggle" data-password-toggle
                                aria-label="Show password" aria-pressed="false">
                                <svg class="toggle-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="toggle-eye-off is-hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                        <p id="reset-confirm-error" class="form-error is-hidden"></p>
                    </div>

                    <button type="submit" id="reset-submit" class="btn btn--primary btn--block">Reset Password</button>
                </form>
            </div>
        </section>

        <section class="reset__hero">
            <div class="reset__hero-content">
                <h2 class="reset__hero-title">Welcome Back!</h2>
                <p class="reset__hero-text">
                    To keep connected with us please login with your personal info
                </p>
            </div>
        </section>
    </main>

    <script type="module" src="/js/core/reset-password.js"></script>
</body>
</html>
